name: CI

on:
  pull_request:
    branches: [main]

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the Dockerfile's python:3.12-slim
          cache: pip
          cache-dependency-path: workflow-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check (config in workflow-backend/ruff.toml)
        run: ruff check . --output-format github

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workflow-backend/requirements.txt
            workflow-backend/requirements-dev.txt
      - run: pip install -r requirements.txt
      # Pure-logic unit tests: no Postgres, Redis or network needed.
      - name: pytest
        run: python -m pytest -v --tb=short

  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workflow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "API healthy after $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::API did not report healthy within 120s"
          exit 1

      - name: Wait for the Celery worker
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T worker celery -A tasks inspect ping --timeout 2 >/dev/null 2>&1; then
              echo "Worker ready after $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::Celery worker did not answer a ping within 60s"
          exit 1

      # Every HTTP block in the smoke test calls the API's own /health over
      # the compose network, so no third-party services or secrets are used.
      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Dump service logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down the stack
        if: always()
        run: docker compose down -v --remove-orphans

  frontend-lint-test-build:
    name: frontend-lint-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Vite 8 needs Node 20.19+ or 22.12+
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test
        run: npm run test --if-present # no test script yet; runs once one is added
      - name: Build (tsc -b && vite build)
        run: npm run build
