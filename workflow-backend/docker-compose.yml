services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dag_user
      POSTGRES_PASSWORD: dag_password
      POSTGRES_DB: dag_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dag_user -d dag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: celery -A tasks worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://dag_user:dag_password@postgres:5432/dag_db
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      # Decrypts saved credentials (clients' own API keys). Same value as the api.
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-}
      # Server-wide fallback for llm blocks with no credential selected, read
      # from workflow-backend/.env. Empty is fine: those blocks then fail fast.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      # 1 adds the scripted LLM provider (CI and the smoke test only). Off by default.
      - ENABLE_TEST_PROVIDERS=${ENABLE_TEST_PROVIDERS:-0}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Enqueues the periodic tasks (wait timeouts, due schedules, stuck blocks);
  # the worker runs them. The schedule file lives in /tmp so nothing is
  # written into the bind-mounted repo.
  beat:
    build: .
    command: celery -A tasks beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://dag_user:dag_password@postgres:5432/dag_db
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://dag_user:dag_password@postgres:5432/dag_db
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      # Encrypts credentials saved through /credentials.
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-}
      # 1 adds the scripted provider and the /_test/echo endpoints. Off by default.
      - ENABLE_TEST_PROVIDERS=${ENABLE_TEST_PROVIDERS:-0}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
