# Lint config for CI (backend-lint). Deliberately small: things that are
# real bugs rather than style — syntax errors, undefined names, unused or
# redefined imports, unused locals, broken comparisons. Formatting isn't
# enforced.
target-version = "py312"
line-length = 120

[lint]
select = [
    "E9",    # syntax / IO errors
    "F63",   # invalid comparisons (e.g. `is` with a literal)
    "F7",    # misplaced break/continue/return/yield
    "F82",   # undefined names
    "F401",  # unused imports
    "F811",  # redefined while unused
    "F841",  # local assigned but never used
]
